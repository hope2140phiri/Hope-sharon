<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hope & Sharon ❤️</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .cover {
            width: 100%;
            height: 100vh;

            background-image:
                linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)),
                url("background.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;

            position: relative;
            overflow: hidden;
        }

        .content {
            color: white;
            z-index: 10;
        }

        .heart {
            font-size: 75px;
            animation: heartbeat 1.5s infinite;
        }

        h1 {
            font-size: 44px;
            margin: 15px 0 10px;
            text-shadow: 2px 2px 10px black;
        }

        p {
            font-size: 21px;
            text-shadow: 1px 1px 6px black;
        }

        .floating-heart {
            position: absolute;
            bottom: -50px;
            font-size: 25px;
            animation: floatUp linear infinite;
            opacity: 0.8;
        }

        .heart1 {
            left: 10%;
            animation-duration: 7s;
        }

        .heart2 {
            left: 30%;
            animation-duration: 9s;
            animation-delay: 2s;
        }

        .heart3 {
            left: 50%;
            animation-duration: 6s;
            animation-delay: 1s;
        }

        .heart4 {
            left: 70%;
            animation-duration: 8s;
            animation-delay: 3s;
        }

        .heart5 {
            left: 90%;
            animation-duration: 10s;
            animation-delay: 1s;
        }

        @keyframes heartbeat {
            0%, 100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.25);
            }
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg);
                opacity: 0;
            }

            10% {
                opacity: 0.8;
            }

            90% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) rotate(360deg);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="cover">

        <div class="floating-heart heart1">❤️</div>
        <div class="floating-heart heart2">💕</div>
        <div class="floating-heart heart3">❤️</div>
        <div class="floating-heart heart4">💗</div>
        <div class="floating-heart heart5">💕</div>

        <div class="content">

            <div class="heart">❤️</div>

            <h1>Hope & Sharon</h1>

            <p>Our Love Story 💕</p>

        </div>

    </div>

</body>
</html>
