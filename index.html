<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hope & Sharon - Our Love Story</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    font-family: Georgia, serif;
    background: #000;
    overflow: hidden;
}

.cover {
    width: 100%;
    height: 100vh;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    background:
        linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.65)),
        url("hope.jpg") center/cover no-repeat;
}

.book {
    width: 90%;
    max-width: 500px;
    padding: 45px 25px;
    border: 2px solid rgba(255,255,255,0.7);
    border-radius: 25px;
    background: rgba(0,0,0,0.35);
    backdrop-filter: blur(4px);
    box-shadow: 0 0 30px rgba(255,20,147,0.7);
}

.heart {
    font-size: 55px;
    margin-bottom: 15px;
    animation: beat 1.3s infinite;
}

h1 {
    color: white;
    font-size: 42px;
    letter-spacing: 3px;
    margin-bottom: 15px;
}

.subtitle {
    color: #ffb6d9;
    font-size: 25px;
    margin-bottom: 25px;
    font-style: italic;
}

.line {
    width: 80%;
    height: 2px;
    background: white;
    margin: 20px auto;
    opacity: 0.7;
}

.quote {
    color: white;
    font-size: 18px;
    line-height: 1.6;
    margin-bottom: 30px;
}

.start-btn {
    display: inline-block;
    padding: 14px 35px;
    background: #ff1493;
    color: white;
    text-decoration: none;
    border-radius: 30px;
    font-size: 18px;
    box-shadow: 0 5px 20px rgba(255,20,147,0.6);
    transition: 0.3s;
}

.start-btn:hover {
    transform: scale(1.08);
    background: #ff69b4;
}

.footer {
    margin-top: 25px;
    color: #ddd;
    font-size: 14px;
}

@keyframes beat {
    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }
}
</style>
</head>

<body>

<div class="cover">

    <div class="book">

        <div class="heart">❤️</div>

        <h1>Hope & Sharon</h1>

        <div class="subtitle">
            Our Love Story
        </div>

        <div class="line"></div>

        <div class="quote">
            “Two hearts, one journey,<br>
            one beautiful story.”
        </div>

        <a href="chapter1.html" class="start-btn">
            Begin Our Story ❤️
        </a>

        <div class="footer">
            A story written by Hope & Sharon
        </div>

    </div>

</div>

</body>
</html>
