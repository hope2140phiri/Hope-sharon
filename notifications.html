<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Notifications - Hope & Sharon</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    padding-bottom: 70px;
}


/* TOP BAR */

.topbar {
    height: 60px;

    background: #ff1493;

    color: white;

    display: flex;

    align-items: center;

    padding: 0 15px;

    position: sticky;

    top: 0;

    z-index: 100;
}

.back {
    font-size: 28px;

    margin-right: 15px;

    cursor: pointer;
}

.title {
    font-size: 20px;

    font-weight: bold;
}


/* NOTIFICATIONS */

.notifications {
    background: white;
}

.notification {
    display: flex;

    align-items: center;

    gap: 12px;

    padding: 14px 15px;

    border-bottom: 1px solid #eee;

    cursor: pointer;
}

.notification:hover {
    background: #f8f8f8;
}

.icon {
    width: 48px;

    height: 48px;

    border-radius: 50%;

    background: #ffe1ef;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 23px;

    flex-shrink: 0;
}

.notification-info {
    flex: 1;
}

.notification-title {
    font-weight: bold;

    font-size: 15px;
}

.notification-text {
    color: #666;

    font-size: 13px;

    margin-top: 4px;
}

.notification-time {
    color: #999;

    font-size: 11px;
}


/* EMPTY */

.empty {
    text-align: center;

    background: white;

    padding: 60px 20px;

    color: #777;
}

.empty-icon {
    font-size: 55px;

    margin-bottom: 10px;
}


/* BOTTOM NAV */

.bottom-nav {
    position: fixed;

    bottom: 0;

    left: 0;

    right: 0;

    height: 60px;

    background: white;

    border-top: 1px solid #ddd;

    display: flex;

    justify-content: space-around;

    align-items: center;

    z-index: 100;
}

.nav-item {
    text-align: center;

    font-size: 12px;

    color: #555;

    cursor: pointer;
}

.nav-item span {
    display: block;

    font-size: 22px;
}

.nav-item.active {
    color: #ff1493;

    font-weight: bold;
}

</style>

</head>


<body>


<!-- TOP BAR -->

<div class="topbar">

    <div
        class="back"
        onclick="location.href='home.html'">

        ←

    </div>


    <div class="title">

        Notifications 🔔

    </div>

</div>


<!-- NOTIFICATIONS -->

<div
    id="notifications"
    class="notifications">
</div>


<!-- BOTTOM NAV -->

<div class="bottom-nav">


    <div
        class="nav-item"
        onclick="location.href='home.html'">

        <span>🏠</span>

        Home

    </div>


    <div
        class="nav-item"
        onclick="location.href='friends.html'">

        <span>👥</span>

        Friends

    </div>


    <div
        class="nav-item"
        onclick="location.href='message.html'">

        <span>💬</span>

        Messages

    </div>


    <div class="nav-item active">

        <span>🔔</span>

        Notifications

    </div>


    <div
        class="nav-item"
        onclick="location.href='profile.html'">

        <span>👤</span>

        Profile

    </div>

</div>


<script>


/* GET FRIENDS */

function getFriends() {

    return JSON.parse(

        localStorage.getItem(
            "hopeSharonFriends"
        ) || "[]"

    );

}


/* LOAD NOTIFICATIONS */

function loadNotifications() {

    const container =
        document.getElementById(
            "notifications"
        );


    const friends =
        getFriends();


    let notifications = [];


    /* FRIEND REQUESTS */

    const requests =
        JSON.parse(

            localStorage.getItem(
                "hopeSharonRequests"
            ) || "[]"

        );


    requests.forEach(
        function(request) {

            notifications.push({

                icon: "👥",

                title:
                    request.name ||
                    "Someone",

                text:
                    "sent you a friend request",

                time:
                    request.time ||
                    "Recently",

                link:
                    "friends.html"

            });

        }
    );


    /* MESSAGES */

    friends.forEach(
        function(friend) {

            const messages =
                JSON.parse(

                    localStorage.getItem(
                        "hopeSharonMessages_" +
                        friend.id
                    ) || "[]"

                );


            messages.forEach(
                function(message) {

                    if (
                        message.sender ===
                        "friend"
                    ) {

                        notifications.push({

                            icon: "💬",

                            title:
                                friend.name,

                            text:
                                "sent you a message",

                            time:
                                message.time,

                            link:
                                "chat.html?id=" +
                                friend.id

                        });

                    }

                }
            );

        }
    );


    /* SORT */

    notifications.reverse();


    container.innerHTML = "";


    /* EMPTY */

    if (
        notifications.length === 0
    ) {

        container.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    🔔
                </div>

                <h3>
                    No notifications
                </h3>

                <p style="margin-top:8px;">
                    You're all caught up ❤️
                </p>

            </div>

        `;

        return;

    }


    /* DISPLAY */

    notifications.forEach(
        function(notification) {

            const item =
                document.createElement(
                    "div"
                );


            item.className =
                "notification";


            item.onclick =
                function() {

                    location.href =
                        notification.link;

                };


            item.innerHTML = `

                <div class="icon">

                    ${notification.icon}

                </div>


                <div class="notification-info">

                    <div class="notification-title">

                        ${escapeHTML(
                            notification.title
                        )}

                    </div>


                    <div class="notification-text">

                        ${escapeHTML(
                            notification.text
                        )}

                    </div>

                </div>


                <div class="notification-time">

                    ${escapeHTML(
                        notification.time
                    )}

                </div>

            `;


            container.appendChild(
                item
            );

        }
    );

}


/* ESCAPE */

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent =
        text;

    return div.innerHTML;

}


/* START */

loadNotifications();

</script>


</body>

</html>
