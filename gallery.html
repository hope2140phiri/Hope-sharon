<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sharon ❤️ Hope Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    background: linear-gradient(135deg, #ff4b91, #6a5cff);
    color: white;
}

.header {
    padding: 16px;
    text-align: center;
    background: rgba(0,0,0,0.25);
}

.header h1 {
    margin: 8px 0;
}

.back {
    display: block;
    text-align: left;
    color: white;
    text-decoration: none;
    font-size: 17px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
}

.upload-btn {
    flex: 1;
    padding: 14px 8px;
    border: none;
    border-radius: 15px;
    background: white;
    color: #ff1493;
    font-weight: bold;
    text-align: center;
    cursor: pointer;
}

.upload-btn input {
    display: none;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
}

.item {
    position: relative;
}

.item img,
.item video {
    width: 100%;
    height: 180px;
    object-fit: cover;
    border-radius: 15px;
    background: rgba(0,0,0,0.3);
}

.item img {
    cursor: pointer;
}

.delete-btn {
    position: absolute;
    top: 7px;
    right: 7px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.75);
    color: white;
    cursor: pointer;
}

.title {
    text-align: center;
    margin: 25px 0 15px;
}

.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 1000;
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
}

.viewer img {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
}

.close {
    position: absolute;
    top: 10px;
    right: 20px;
    font-size: 45px;
    cursor: pointer;
}

.empty {
    grid-column: 1 / -1;
    text-align: center;
    padding: 25px;
}

@media (max-width: 500px) {
    .item img,
    .item video {
        height: 150px;
    }
}
</style>
</head>

<body>

<div class="header">

    <a class="back" href="message.html">← Back to Chat</a>

    <h1>💕 Sharon & Hope Gallery 💕</h1>

</div>

<div class="container">

    <div class="buttons">

        <label class="upload-btn">
            📸 Add Photo
            <input
                type="file"
                accept="image/*"
                multiple
                onchange="savePhotos(event)">
        </label>

        <label class="upload-btn">
            🎥 Add Video
            <input
                type="file"
                accept="video/*"
                multiple
                onchange="saveVideos(event)">
        </label>

    </div>

    <h2 class="title">📸 Our Photos</h2>

    <div class="gallery" id="photoGallery">

        <div class="item">
            <img src="photo1.jpg"
                 onclick="openPhoto(this.src)"
                 alt="Photo">
        </div>

        <div class="item">
            <img src="photo2.jpg"
                 onclick="openPhoto(this.src)"
                 alt="Photo">
        </div>

        <div class="item">
            <img src="photo3.jpg"
                 onclick="openPhoto(this.src)"
                 alt="Photo">
        </div>

        <div class="item">
            <img src="sharon.jpg"
                 onclick="openPhoto(this.src)"
                 alt="Sharon">
        </div>

        <div class="item">
            <img src="hope.jpg"
                 onclick="openPhoto(this.src)"
                 alt="Hope">
        </div>

    </div>

    <h2 class="title">🎥 Our Videos</h2>

    <div class="gallery" id="videoGallery">

        <div class="item">
            <video controls>
                <source src="video.mp4" type="video/mp4">
            </video>
        </div>

    </div>

</div>

<div class="viewer" id="viewer" onclick="closePhoto()">

    <span class="close">×</span>

    <img id="fullPhoto">

</div>

<script>

let db;

const request = indexedDB.open("HopeSharonGallery", 1);

request.onupgradeneeded = function(event) {

    db = event.target.result;

    if (!db.objectStoreNames.contains("media")) {
        db.createObjectStore("media", {
            keyPath: "id",
            autoIncrement: true
        });
    }
};

request.onsuccess = function(event) {

    db = event.target.result;

    loadSavedMedia();
};

request.onerror = function() {

    alert("Gallery storage could not be opened.");
};


function savePhotos(event) {

    const files = event.target.files;

    for (const file of files) {

        if (!file.type.startsWith("image/")) {
            continue;
        }

        const transaction =
            db.transaction(["media"], "readwrite");

        const store =
            transaction.objectStore("media");

        store.add({
            type: "photo",
            file: file
        });
    }

    event.target.value = "";

    setTimeout(loadSavedMedia, 300);
}


function saveVideos(event) {

    const files = event.target.files;

    for (const file of files) {

        if (!file.type.startsWith("video/")) {
            continue;
        }

        const transaction =
            db.transaction(["media"], "readwrite");

        const store =
            transaction.objectStore("media");

        store.add({
            type: "video",
            file: file
        });
    }

    event.target.value = "";

    setTimeout(loadSavedMedia, 300);
}


function loadSavedMedia() {

    if (!db) return;

    const photoGallery =
        document.getElementById("photoGallery");

    const videoGallery =
        document.getElementById("videoGallery");

    const transaction =
        db.transaction(["media"], "readonly");

    const store =
        transaction.objectStore("media");

    const request = store.getAll();

    request.onsuccess = function() {

        for (const media of request.result) {

            const url =
                URL.createObjectURL(media.file);

            const item =
                document.createElement("div");

            item.className = "item";

            const deleteButton =
                document.createElement("button");

            deleteButton.className = "delete-btn";
            deleteButton.textContent = "🗑️";

            deleteButton.onclick = function() {

                deleteMedia(media.id);

                item.remove();
            };


            if (media.type === "photo") {

                const image =
                    document.createElement("img");

                image.src = url;

                image.onclick = function() {
                    openPhoto(url);
                };

                item.appendChild(image);
                item.appendChild(deleteButton);

                photoGallery.appendChild(item);

            } else {

                const video =
                    document.createElement("video");

                video.src = url;
                video.controls = true;

                item.appendChild(video);
                item.appendChild(deleteButton);

                videoGallery.appendChild(item);
            }
        }
    };
}


function deleteMedia(id) {

    const transaction =
        db.transaction(["media"], "readwrite");

    const store =
        transaction.objectStore("media");

    store.delete(id);
}


function openPhoto(src) {

    document.getElementById("fullPhoto").src = src;

    document.getElementById("viewer").style.display =
        "flex";
}


function closePhoto() {

    document.getElementById("viewer").style.display =
        "none";
}

</script>

</body>
</html>
