<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hope & Sharon - Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }

        .login-page {
            width: 100%;
            height: 100vh;

            background-image:
                linear-gradient(rgba(0,0,0,0.45), rgba(0,0,0,0.45)),
                url("background.jpg");

            background-size: cover;
            background-position: center;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-box {
            width: 90%;
            max-width: 380px;
            padding: 30px;
            background: rgba(255, 255, 255, 0.92);
            border-radius: 25px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .heart {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h1 {
            color: #ff1493;
            margin-bottom: 5px;
        }

        .subtitle {
            color: #555;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
            outline: none;
        }

        input:focus {
            border-color: #ff1493;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #ff1493;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        button:active {
            transform: scale(0.97);
        }

        #message {
            margin-top: 15px;
            font-weight: bold;
        }

        .back {
            display: block;
            margin-top: 20px;
            color: #ff1493;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-page">

        <div class="login-box">

            <div class="heart">❤️</div>

            <h1>Hope & Sharon</h1>

            <p class="subtitle">Welcome back 💕</p>

            <form onsubmit="login(event)">

                <input
                    type="text"
                    id="username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="password"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login ❤️
                </button>

            </form>

            <p id="message"></p>

            <a href="index.html" class="back">
                ← Back to Cover
            </a>

        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            /*
             * Demo login for now.
             * We will replace this with a proper login system later.
             */

            if (username === "hope" && password === "1234") {
                message.style.color = "green";
                message.textContent = "Login successful ❤️";

                setTimeout(function() {
                    window.location.href = "gallery.html";
                }, 1000);

            } else {
                message.style.color = "red";
                message.textContent = "Wrong username or password.";
            }
        }
    </script>

</body>
</html>
