<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Create Post - Hope & Sharon</title><style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f0f2f5;
    padding-bottom: 70px;
}

.topbar {
    height: 60px;
    background: #ff1493;
    color: white;
    display: flex;
    align-items: center;
    padding: 0 15px;
    position: sticky;
    top: 0;
    z-index: 100;
}

.back {
    font-size: 28px;
    margin-right: 15px;
    cursor: pointer;
}

.title {
    font-size: 21px;
    font-weight: bold;
}

.create-box {
    background: white;
    padding: 18px;
}

.user {
    display: flex;
    align-items: center;
    margin-bottom: 15px;
}

.avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    object-fit: cover;
    margin-right: 10px;
}

.user-name {
    font-weight: bold;
    font-size: 17px;
}

textarea {
    width: 100%;
    min-height: 130px;
    border: none;
    outline: none;
    resize: none;
    font-size: 18px;
    padding: 10px 0;
}

.preview {
    display: none;
    margin-top: 10px;
    position: relative;
}

.preview img,
.preview video {
    width: 100%;
    max-height: 400px;
    object-fit: contain;
    border-radius: 10px;
    background: #111;
}

.remove {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 35px;
    height: 35px;
    border: none;
    border-radius: 50%;
    background: rgba(0,0,0,0.7);
    color: white;
    font-size: 20px;
    cursor: pointer;
    z-index: 2;
}

.options {
    border-top: 1px solid #eee;
    margin-top: 15px;
    padding-top: 12px;
}

.option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 5px;
    cursor: pointer;
    border-radius: 8px;
}

.option:hover {
    background: #f5f5f5;
}

.option-icon {
    font-size: 25px;
}

.option-text {
    font-weight: bold;
}

.post-btn {
    width: 100%;
    border: none;
    background: #ff1493;
    color: white;
    padding: 14px;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    margin-top: 15px;
    cursor: pointer;
}

input[type="file"] {
    display: none;
}

.bottom-nav {
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    height: 60px;
    background: white;
    border-top: 1px solid #ddd;
    display: flex;
    justify-content: space-around;
    align-items: center;
    z-index: 100;
}

.nav-item {
    text-align: center;
    font-size: 12px;
    color: #555;
    cursor: pointer;
}

.nav-item span {
    display: block;
    font-size: 22px;
}

.nav-item.active {
    color: #ff1493;
    font-weight: bold;
}

</style></head><body><div class="topbar"><div
    class="back"
    onclick="location.href='home.html'">

    ←

</div>

<div class="title">

    Create Post ➕

</div>

</div><div class="create-box"><div class="user">

    <img
        src="background.jpg"
        class="avatar">

    <div class="user-name">

        Hope & Sharon ❤️

    </div>

</div>


<textarea
    id="postText"
    placeholder="What's on your mind? ❤️">
</textarea>


<!-- IMAGE PREVIEW -->

<div
    class="preview"
    id="imagePreview">

    <button
        class="remove"
        onclick="removeMedia()">

        ×

    </button>

    <img
        id="previewImage"
        src="">

</div>


<!-- VIDEO PREVIEW -->

<div
    class="preview"
    id="videoPreview">

    <button
        class="remove"
        onclick="removeMedia()">

        ×

    </button>

    <video
        id="previewVideo"
        controls>
    </video>

</div>


<div class="options">


    <label
        class="option"
        for="photoInput">

        <div class="option-icon">
            📷
        </div>

        <div class="option-text">
            Photo
        </div>

    </label>


    <input
        type="file"
        id="photoInput"
        accept="image/*"
        onchange="choosePhoto(event)">


    <label
        class="option"
        for="videoInput">

        <div class="option-icon">
            🎥
        </div>

        <div class="option-text">
            Video
        </div>

    </label>


    <input
        type="file"
        id="videoInput"
        accept="video/*"
        onchange="chooseVideo(event)">

</div>


<button
    class="post-btn"
    onclick="publishPost()">

    🚀 Post

</button>

</div><div class="bottom-nav"><div
    class="nav-item"
    onclick="location.href='home.html'">

    <span>🏠</span>
    Home

</div>


<div
    class="nav-item"
    onclick="location.href='friends.html'">

    <span>👥</span>
    Friends

</div>


<div class="nav-item active">

    <span>➕</span>
    Create

</div>


<div
    class="nav-item"
    onclick="location.href='message.html'">

    <span>💬</span>
    Messages

</div>


<div
    class="nav-item"
    onclick="location.href='profile.html'">

    <span>👤</span>
    Profile

</div>

</div><script>

let selectedFile = null;
let selectedType = null;


/* PHOTO */

function choosePhoto(event) {

    const file = event.target.files[0];

    if (!file) return;

    selectedFile = file;
    selectedType = "image";

    const reader = new FileReader();

    reader.onload = function(e) {

        document.getElementById(
            "previewImage"
        ).src = e.target.result;

        document.getElementById(
            "imagePreview"
        ).style.display = "block";

        document.getElementById(
            "videoPreview"
        ).style.display = "none";

    };

    reader.readAsDataURL(file);

}


/* VIDEO */

function chooseVideo(event) {

    const file = event.target.files[0];

    if (!file) return;

    selectedFile = file;
    selectedType = "video";

    const reader = new FileReader();

    reader.onload = function(e) {

        document.getElementById(
            "previewVideo"
        ).src = e.target.result;

        document.getElementById(
            "videoPreview"
        ).style.display = "block";

        document.getElementById(
            "imagePreview"
        ).style.display = "none";

    };

    reader.readAsDataURL(file);

}


/* REMOVE */

function removeMedia() {

    selectedFile = null;
    selectedType = null;

    document.getElementById(
        "imagePreview"
    ).style.display = "none";

    document.getElementById(
        "videoPreview"
    ).style.display = "none";

    document.getElementById(
        "photoInput"
    ).value = "";

    document.getElementById(
        "videoInput"
    ).value = "";

}


/* SAVE POST */

function publishPost() {

    const text =
        document.getElementById(
            "postText"
        ).value.trim();


    if (!text && !selectedFile) {

        alert(
            "Write something or choose a photo/video first. ❤️"
        );

        return;

    }


    if (selectedFile) {

        const reader = new FileReader();

        reader.onload = function(e) {

            savePost(
                text,
                e.target.result,
                selectedType
            );

        };

        reader.readAsDataURL(selectedFile);

    } else {

        savePost(
            text,
            null,
            null
        );

    }

}


/* SAVE TO LOCAL STORAGE */

function savePost(text, media, type) {

    const posts =
        JSON.parse(
            localStorage.getItem(
                "hopeSharonPosts"
            ) || "[]"
        );


    const post = {

        id: Date.now(),

        name: "Hope & Sharon ❤️",

        text: text,

        media: media,

        type: type,

        time: new Date()
            .toLocaleString()

    };


    posts.unshift(post);


    localStorage.setItem(
        "hopeSharonPosts",
        JSON.stringify(posts)
    );


    alert(
        "Your post has been published! ❤️"
    );


    location.href = "home.html";

}

</script></body></html>
